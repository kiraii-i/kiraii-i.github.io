<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>artshop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#6b6b6b;--line:#d9d9d9;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f2;--mut:#8f8f8f;--line:#2a2a2a;--card:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f2;--mut:#8f8f8f;--line:#2a2a2a;--card:#111;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;padding:14px 24px;z-index:5;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:-.02em;margin-right:auto}
a,button{color:inherit;cursor:pointer}
nav a{text-decoration:none;color:var(--mut)}nav a.on,nav a:hover{color:var(--fg)}
nav{display:flex;gap:18px;flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:clamp(30px,6vw,56px);letter-spacing:-.04em;line-height:1.05;margin:0 0 12px;font-weight:600}
h2{font-size:14px;margin:48px 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:6px}
.img{aspect-ratio:4/5;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);overflow:hidden;cursor:pointer}
.img img{width:100%;height:100%;object-fit:cover}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:9px 14px;font:inherit;font-size:13px}
.btn.o{background:transparent;color:var(--fg);border-color:var(--line)}.btn.s{padding:4px 8px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:9px;font:inherit;margin:4px 0 12px}
label{display:block;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--line);background:var(--card);padding:20px;max-width:560px}
.wide{max-width:none}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--fg);padding:24px;max-width:760px;width:calc(100% - 24px);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.mut{color:var(--mut)}.tag{border:1px solid var(--line);padding:1px 6px}
#slip{display:none}
@media print{body>*:not(#slip){display:none!important}#slip{display:block;color:#000;background:#fff;font:14px/1.5 Arial;padding:20px}#slip table td,#slip table th{border-color:#000}}
</style></head><body>
<header><b>artshop<span class="mut">/</span></b>
<nav class="m"><a href="#gallery" data-r="gallery">Gallery</a><a href="#commission" data-r="commission">Custom</a><a href="#admin" data-r="admin" id="nadm" hidden>Dashboard</a><a href="#login" data-r="login">Login</a><a href="#cart" data-r="cart" id="ncart">Cart (0)</a></nav></header>
<main id="v"></main><div id="slip"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SIZES=[["S","20×25 cm"],["M","30×40 cm"],["L","50×70 cm"]];
let db=null,user=null,assets=null,isAdmin=false,me=null,art=[],orders=[],team=[],comms=[],cfg={shipping:15},cart=[];
try{cart=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}$("#ncart").textContent="Cart ("+cart.length+")"};
const money=n=>"$"+Number(n||0).toFixed(2),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const imgTag=a=>a.imageId?`<img src="/_blob/${esc(a.imageId)}" alt="${esc(a.title)}">`:"no image";

const J=(u,o={})=>fetch(u,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o}).then(async x=>{const d=await x.json().catch(()=>({}));if(!x.ok)throw new Error(d.error||"Error "+x.status);return d});
const subs=[],refresh=()=>subs.forEach(f=>f());
const DB={collection:c=>({onSnapshot(cb,er){const f=()=>J("/api/data/"+c).then(d=>cb({docs:d.map(x=>({id:x.id,data:()=>x.data}))})).catch(er);subs.push(f);f();setInterval(f,20000)}}),
doc:p=>{const[c,i]=p.split("/"),u="/api/data/"+c+"/"+i;return{onSnapshot(cb,er){const f=()=>J(u).then(d=>cb({exists:!!d,data:()=>d})).catch(er);f()},set:d=>J(u,{method:"PUT",body:JSON.stringify(d)}).then(refresh),delete:()=>J(u,{method:"DELETE"}).then(refresh)}}};
const ASSETS={upload:f=>fetch("/api/upload",{method:"POST",credentials:"same-origin",headers:{"Content-Type":f.type},body:f}).then(async x=>{const d=await x.json();if(!x.ok)throw new Error(d.error);return d})};
function sub(name,fn){db.collection(name).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render()},()=>{})}
async function init(){
  render();
  db=DB;assets=ASSETS;try{me=await J("/api/me");isAdmin=!!me.admin}catch(e){}
  
  $("#nadm").hidden=!isAdmin;
  if(!db){render();return}
  sub("artworks",d=>art=d);
  db.doc("settings/site").onSnapshot(s=>{if(s.exists)cfg={...cfg,...s.data()};render()},()=>{});
  if(isAdmin){sub("orders",d=>orders=d.flatMap(x=>(x.list||[]).map(o=>({...o,uid:x.id}))).sort((a,b)=>b.at-a.at));sub("team",d=>team=d);sub("commissions",d=>comms=d.flatMap(x=>x.list||[]).sort((a,b)=>b.at-a.at))}
}
addEventListener("hashchange",render);

function render(){
  const r=(location.hash.slice(1)||"gallery");
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  saveCart();
  $("#v").innerHTML=({gallery,commission,login,admin,cart:cartV}[r]||gallery)();
}

function gallery(){
  const years=[...new Set(art.map(a=>a.year))].sort((a,b)=>b-a);
  let h=`<div class="m mut">Archive / Portfolio</div><h1>Original works &amp; prints.</h1><p class="mut">Every piece, by year. Originals are one of one; prints come in three sizes.</p>`;
  if(isAdmin)h+=`<button class="btn" onclick="editArt()">+ Upload new artwork</button>`;
  if(!db)h+=`<p class="box mut">Sign in to claude.ai to load the live catalogue.</p>`;
  else if(!art.length)h+=`<p class="box mut">No artworks published yet.${isAdmin?" Use the button above to add your first.":""}</p>`;
  years.forEach(y=>{h+=`<h2 class="m"><span>${y}</span><span class="mut">${art.filter(a=>a.year==y).length} works</span></h2><div class="grid">`+
    art.filter(a=>a.year==y).map(a=>`<div class="card"><div class="img" onclick="detail('${a.id}')">${imgTag(a)}</div><b>${esc(a.title)}</b><span class="mut">${esc(a.medium)} · ${esc(a.dims)}</span>
    <span class="m">${a.sold?"Original sold":"Original "+money(a.price)}</span>
    <div class="row"><button class="btn s" onclick="detail('${a.id}')">View</button>${isAdmin?`<button class="btn o s" onclick="editArt('${a.id}')">Edit</button><button class="btn o s" onclick="delArt('${a.id}')">Delete</button>`:""}</div></div>`).join("")+`</div>`});
  return h;
}
function detail(id){
  const a=art.find(x=>x.id==id);if(!a)return;
  const p=a.prints||{};
  $("#dlg").innerHTML=`<div class="row" style="justify-content:space-between"><span class="m mut">${a.year}</span><button class="btn o s" onclick="dlg.close()">Close</button></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:12px"><div class="img" style="cursor:default">${imgTag(a)}</div><div>
  <h1 style="font-size:32px">${esc(a.title)}</h1><table><tr><td class="mut">Medium</td><td>${esc(a.medium)}</td></tr><tr><td class="mut">Dimensions</td><td>${esc(a.dims)}</td></tr><tr><td class="mut">Year</td><td>${a.year}</td></tr>${a.notes?`<tr><td class="mut">Notes</td><td>${esc(a.notes)}</td></tr>`:""}</table>
  <p class="mut">${esc(a.desc)}</p>
  <div class="m" style="margin:16px 0 6px">Original</div>
  ${a.sold?`<span class="tag m">Sold</span>`:`<button class="btn" onclick="add('${a.id}','O')">Buy original · ${money(a.price)}</button>`}
  <div class="m" style="margin:16px 0 6px">Print / reproduction</div>
  <div class="row">${SIZES.map(([k,s])=>`<button class="btn o" onclick="add('${a.id}','${k}')">${k} · ${s}<br>${money(p[k])}</button>`).join("")}</div></div></div>`;
  $("#dlg").showModal();
}
function add(id,k){const a=art.find(x=>x.id==id);if(k==="O"&&cart.some(c=>c.id==id&&c.k=="O"))return;
  const s=k==="O"?"Original":"Print "+k+" ("+SIZES.find(x=>x[0]==k)[1]+")";
  cart.push({id,k,title:a.title,label:s,price:k==="O"?a.price:(a.prints||{})[k]});saveCart();$("#dlg").close();location.hash="cart"}
function cartV(){
  const s=cart.reduce((t,c)=>t+Number(c.price||0),0),ship=cart.length?Number(cfg.shipping):0;
  if(!cart.length)return`<h1>Cart</h1><p class="mut">Your cart is empty.</p>`;
  return`<h1>Checkout</h1><div class="box wide"><table>${cart.map((c,i)=>`<tr><td>${esc(c.title)}<br><span class="mut">${esc(c.label)}</span></td><td>${money(c.price)}</td><td><button class="btn o s" onclick="cart.splice(${i},1);render()">Remove</button></td></tr>`).join("")}
  <tr><td class="mut">Subtotal</td><td colspan=2>${money(s)}</td></tr><tr><td class="mut">Shipping</td><td colspan=2>${money(ship)}</td></tr><tr><td><b>Total</b></td><td colspan=2><b>${money(s+ship)}</b></td></tr></table></div><br>
  <div class="box"><label class="m">Full name</label><input id="cn"><label class="m">Shipping address</label><textarea id="ca" rows=3></textarea><label class="m">Phone number</label><input id="cp" type="tel">
  <button class="btn" onclick="placeOrder()">Place order</button><p class="mut" id="cm">Payment is arranged directly with the artist after the order is received.</p></div>`;
}
async function pushTo(col,item){return J("/api/"+col,{method:"POST",body:JSON.stringify(item)})}
async function placeOrder(){
  const n=$("#cn").value.trim(),a=$("#ca").value.trim(),p=$("#cp").value.trim();
  if(!n||!a||!p){$("#cm").textContent="Please fill in name, address and phone.";return}
  if(!db){$("#cm").textContent="Sign in to claude.ai to place an order.";return}
  const sub=cart.reduce((t,c)=>t+Number(c.price||0),0),ship=Number(cfg.shipping),id=uid();
  try{const rr=await pushTo("orders",{name:n,address:a,phone:p,items:cart,subtotal:sub,shipping:ship,total:sub+ship,status:"new"});
    cart=[];saveCart();$("#v").innerHTML=`<h1>Thank you.</h1><p class="mut">Order <b>${rr.id}</b> was sent to the artist.</p>`}
  catch(e){$("#cm").textContent="Could not send the order: "+(e.message||e.code)}
}
function commission(){return`<div class="m mut">Custom</div><h1>Commission a piece.</h1><div class="box"><label class="m">Name</label><input id="kn"><label class="m">Email or phone</label><input id="kc"><label class="m">Size &amp; medium (if known)</label><input id="ks"><label class="m">Your idea</label><textarea id="kd" rows=5></textarea><label class="m">Budget (optional)</label><input id="kb">
  <button class="btn" onclick="sendComm()">Send request</button><p class="mut" id="km"></p></div>`}
async function sendComm(){
  const o={at:Date.now(),name:$("#kn").value,contact:$("#kc").value,size:$("#ks").value,idea:$("#kd").value,budget:$("#kb").value};
  if(!o.name||!o.contact||!o.idea){$("#km").textContent="Name, contact and idea are required.";return}
  if(!db){$("#km").textContent="Sign in to claude.ai to send a request.";return}
  try{await pushTo("commissions",o);$("#km").textContent="Request sent. The artist will be in touch."}catch(e){$("#km").textContent="Failed: "+(e.message||e.code)}
}
function login(){if(me&&me.email)return`<div class="m mut">Login</div><h1>Signed in.</h1><div class="box"><p>${esc(me.email)} <span class="tag m">Admin</span></p><button class="btn" onclick="logout()">Sign out</button></div>`;
return`<div class="m mut">Login</div><h1>Admin login.</h1><div class="box"><label class="m">Email</label><input id="le" type="email" autocomplete="username"><label class="m">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">Sign in</button><p class="mut" id="lm"></p></div>`}
async function doLogin(){try{await J("/api/login",{method:"POST",body:JSON.stringify({email:$("#le").value,password:$("#lp").value})});location.hash="admin";location.reload()}catch(e){$("#lm").textContent=e.message}}
async function logout(){await J("/api/logout",{method:"POST",body:"{}"});location.hash="gallery";location.reload()}
function admin(){
  if(!isAdmin)return login();
  const open=orders.filter(o=>o.status==="new").length;
  return`<div class="m mut">Dashboard</div><h1>Orders &amp; settings.</h1>
  <h2 class="m"><span>Orders</span><span class="mut">${open} new</span></h2>
  ${orders.length?`<table>${orders.map(o=>`<tr><td><b>${esc(o.name)}</b><br><span class="mut">${new Date(o.at).toLocaleString()} · #${o.id}</span></td><td>${(o.items||[]).map(i=>esc(i.title+" — "+i.label)).join("<br>")}</td><td>${money(o.total)}</td>
  <td class="row"><button class="btn s" onclick="printSlip('${o.id}')">Print Receipt</button><button class="btn o s" onclick="mailOrder('${o.id}')">Email</button><button class="btn o s" onclick="setStatus('${o.id}','${o.status==="new"?"shipped":"new"}')">${o.status==="new"?"Mark shipped":"Reopen"}</button></td></tr>`).join("")}</table>`:`<p class="mut">No orders yet.</p>`}
  <h2 class="m"><span>Custom requests</span></h2>${comms.length?comms.map(c=>`<div class="box wide" style="margin-bottom:8px"><b>${esc(c.name)}</b> · ${esc(c.contact)}<br>${esc(c.idea)}<br><span class="mut">${esc(c.size)} ${esc(c.budget)}</span></div>`).join(""):`<p class="mut">None.</p>`}
  <h2 class="m"><span>Shipping fee</span></h2><div class="row"><input id="sf" type="number" value="${cfg.shipping}" style="width:120px;margin:0"><button class="btn" onclick="saveShip()">Save</button></div>
  <h2 class="m"><span>Team</span></h2><div class="row"><input id="te" type="email" placeholder="teammate@email.com" style="max-width:320px;margin:0"><button class="btn" onclick="addTeam()">Add</button></div>
  <p class="mut">${team.map(t=>`<span class="tag">${esc(t.email)} <a onclick="db.doc('team/${t.id}').delete()">×</a></span>`).join(" ")||"No team members listed."}</p>
  <p class="mut">Team members sign in on the Login page with their email and the temporary password you set.</p>`;
}
const setStatus=(id,s)=>{const o=orders.find(x=>x.id==id),l=orders.filter(x=>x.uid==o.uid).map(({uid,...q})=>({...q,uid,status:q.id==id?s:q.status}));return db.doc("orders/"+o.uid).set({list:l})};
const saveShip=()=>db.doc("settings/site").set({shipping:Number($("#sf").value)||0});
async function addTeam(){const e=$("#te").value.trim();if(!e)return;const p=prompt("Set a temporary password (8+ characters) for "+e);if(!p)return;try{await J("/api/team",{method:"POST",body:JSON.stringify({email:e,password:p})});refresh()}catch(x){alert(x.message)}}
function mailOrder(id){const o=orders.find(x=>x.id==id);
  const b=`Name: ${o.name}\nAddress: ${o.address}\nPhone: ${o.phone}\nItems:\n${(o.items||[]).map(i=>"- "+i.title+" ("+i.label+") "+money(i.price)).join("\n")}\nSubtotal: ${money(o.subtotal)}\nShipping: ${money(o.shipping)}\nTotal: ${money(o.total)}`;
  location.href="mailto:kiraiii.002@gmail.com?subject="+encodeURIComponent("artshop order #"+id)+"&body="+encodeURIComponent(b)}
function printSlip(id){const o=orders.find(x=>x.id==id);
  $("#slip").innerHTML=`<h2 style="font-size:22px;border:0">artshop — packing slip</h2><p>Order #${o.id} · ${new Date(o.at).toLocaleDateString()}</p>
  <p><b>Ship to</b><br>${esc(o.name)}<br>${esc(o.address).replace(/\n/g,"<br>")}<br>Tel: ${esc(o.phone)}</p>
  <table style="border-collapse:collapse"><tr><th>Item</th><th>Option</th><th>Price</th></tr>${(o.items||[]).map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.label)}</td><td>${money(i.price)}</td></tr>`).join("")}
  <tr><td colspan=2>Subtotal</td><td>${money(o.subtotal)}</td></tr><tr><td colspan=2>Shipping</td><td>${money(o.shipping)}</td></tr><tr><td colspan=2><b>Total</b></td><td><b>${money(o.total)}</b></td></tr></table><p>Thank you for supporting independent art.</p>`;
  print()}

function editArt(id){
  const a=art.find(x=>x.id==id)||{prints:{}},p=a.prints||{};
  $("#dlg").innerHTML=`<h1 style="font-size:26px">${id?"Edit":"New"} artwork</h1>
  <label class="m">Title</label><input id="f_t" value="${esc(a.title)}"><div class="row"><div style="flex:1"><label class="m">Year</label><input id="f_y" type="number" value="${a.year||new Date().getFullYear()}"></div><div style="flex:1"><label class="m">Original price</label><input id="f_p" type="number" value="${a.price||""}"></div></div>
  <label class="m">Medium / materials</label><input id="f_m" value="${esc(a.medium)}"><label class="m">Dimensions</label><input id="f_d" value="${esc(a.dims)}"><label class="m">Other notes (framing, signed…)</label><input id="f_n" value="${esc(a.notes)}"><label class="m">Description</label><textarea id="f_s" rows=3>${esc(a.desc)}</textarea>
  <label class="m">Print prices (S 20×25 / M 30×40 / L 50×70)</label><div class="row"><input id="f_S" type="number" value="${p.S||""}" placeholder="S" style="flex:1"><input id="f_M" type="number" value="${p.M||""}" placeholder="M" style="flex:1"><input id="f_L" type="number" value="${p.L||""}" placeholder="L" style="flex:1"></div>
  <label class="m">Image</label><input id="f_i" type="file" accept="image/*"><label class="m"><input id="f_o" type="checkbox" ${a.sold?"checked":""} style="width:auto"> Original sold</label>
  <div class="row"><button class="btn" id="f_b" onclick="saveArt('${id||""}','${a.imageId||""}')">Publish</button><button class="btn o" onclick="dlg.close()">Cancel</button><span class="mut" id="f_e"></span></div>`;
  $("#dlg").showModal();
}
async function saveArt(id,img){
  const v=k=>$("#f_"+k).value;let imageId=img;$("#f_e").textContent="Saving…";
  try{const f=$("#f_i").files[0];if(f){if(!assets)throw new Error("Uploads unavailable");imageId=(await assets.upload(f)).id}
  const data={title:v("t"),year:Number(v("y")),price:Number(v("p")),medium:v("m"),dims:v("d"),notes:v("n"),desc:v("s"),imageId,sold:$("#f_o").checked,prints:{S:Number(v("S")),M:Number(v("M")),L:Number(v("L"))}};
  if(!data.title){$("#f_e").textContent="Title required";return}
  await db.doc("artworks/"+(id||uid())).set(data);$("#dlg").close()}catch(e){$("#f_e").textContent=e.message||e.code}
}
const delArt=id=>{if(confirm("Delete this artwork?"))db.doc("artworks/"+id).delete()};
init();
</script></body></html>
